services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: task_manager_app:latest
    container_name: task_manager_app
    ports:
      - "3001:3001"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    # opcional: para depurar desde VSCode o reiniciar rápido sin rebuild
    volumes:
      - .:/app
      - /app/node_modules
